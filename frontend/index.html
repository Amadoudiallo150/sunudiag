<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SunuDiag - Pre-diagnostic du paludisme</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen p-4 flex items-center justify-center relative overflow-hidden">

  <!-- Motif de fond discret, croix medicales -->
  <div class="absolute inset-0 opacity-[0.03] pointer-events-none" style="background-image: radial-gradient(circle, #0ea5e9 1.5px, transparent 1.5px); background-size: 28px 28px;"></div>

<div class="max-w-md w-full mx-auto relative">

  <header class="text-center mb-6">
    <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-white shadow-lg shadow-sky-900/10 border border-sky-100 mb-3">
      <svg xmlns="http://www.w3.org/2000/svg" class="w-8 h-8 text-sky-600" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
        <path stroke-linecap="round" stroke-linejoin="round" d="M9 3v4M15 3v4M4 7h16v3a8 8 0 01-16 0V7z" />
        <path stroke-linecap="round" stroke-linejoin="round" d="M9 14v3a3 3 0 006 0v-3" />
      </svg>
    </div>
    <h1 class="text-3xl font-extrabold text-slate-800 tracking-tight">SunuDiag</h1>
    <p class="text-sky-700 text-sm mt-1 font-medium">Pre-diagnostic du paludisme</p>
    <span class="inline-block mt-2 text-[11px] font-semibold text-sky-700 bg-sky-100 px-2.5 py-0.5 rounded-full uppercase tracking-wide">Outil clinique assiste par IA</span>
  </header>

  <div class="bg-white rounded-2xl shadow-xl shadow-slate-200/70 border border-slate-100 overflow-hidden">

    <!-- bandeau type carnet de sante -->
    <div class="bg-sky-600 px-6 py-3 flex items-center gap-2">
      <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
      </svg>
      <p class="text-white text-xs font-semibold uppercase tracking-wide">Fiche patient</p>
    </div>

    <div class="p-6 space-y-5">
      <div>
        <label for="age" class="flex items-center gap-1.5 text-sm font-semibold text-slate-700 mb-1">
          <span>🧑</span> Age (annees)
        </label>
        <input type="number" id="age" value="34"
          class="w-full rounded-xl border border-slate-200 bg-slate-50 p-3 text-slate-800 focus:outline-none focus:ring-2 focus:ring-sky-500 focus:border-transparent focus:bg-white transition">
      </div>

      <div>
        <label for="fievre" class="flex items-center gap-1.5 text-sm font-semibold text-slate-700 mb-1">
          <span>🌡️</span> Temperature (C)
        </label>
        <input type="number" id="fievre" step="0.1" value="39.2"
          class="w-full rounded-xl border border-slate-200 bg-slate-50 p-3 text-slate-800 focus:outline-none focus:ring-2 focus:ring-sky-500 focus:border-transparent focus:bg-white transition">
      </div>

      <div>
        <label for="glycemie" class="flex items-center gap-1.5 text-sm font-semibold text-slate-700 mb-1">
          <span>🩸</span> Glycemie (mmol/L)
        </label>
        <input type="number" id="glycemie" step="0.1" value="5.8"
          class="w-full rounded-xl border border-slate-200 bg-slate-50 p-3 text-slate-800 focus:outline-none focus:ring-2 focus:ring-sky-500 focus:border-transparent focus:bg-white transition">
      </div>

      <div>
        <label for="hemoglobine" class="flex items-center gap-1.5 text-sm font-semibold text-slate-700 mb-1">
          <span>💉</span> Hemoglobine (g/dL)
        </label>
        <input type="number" id="hemoglobine" step="0.1" value="13.1"
          class="w-full rounded-xl border border-slate-200 bg-slate-50 p-3 text-slate-800 focus:outline-none focus:ring-2 focus:ring-sky-500 focus:border-transparent focus:bg-white transition">
      </div>

      <div>
        <label for="saison" class="flex items-center gap-1.5 text-sm font-semibold text-slate-700 mb-1">
          <span>🌦️</span> Saison
        </label>
        <select id="saison"
          class="w-full rounded-xl border border-slate-200 bg-slate-50 p-3 text-slate-800 focus:outline-none focus:ring-2 focus:ring-sky-500 focus:border-transparent focus:bg-white transition">
          <option value="1">Saison des pluies</option>
          <option value="0">Saison seche</option>
        </select>
      </div>

      <button id="btn" onclick="analyser()"
        class="w-full bg-sky-600 hover:bg-sky-700 active:bg-sky-800 text-white font-semibold py-3.5 rounded-xl shadow-md shadow-sky-600/25 transition disabled:opacity-60 disabled:cursor-not-allowed flex items-center justify-center gap-2">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z" />
        </svg>
        Analyser
      </button>
    </div>
  </div>

  <div id="resultat" class="mt-5"></div>

  <div class="mt-6 flex items-start gap-2 bg-amber-50 border border-amber-200 rounded-xl p-3">
    <span class="text-amber-500 text-sm mt-0.5">⚠️</span>
    <p class="text-xs text-amber-800 leading-relaxed">
      Outil de pre-diagnostic. Ne remplace jamais l'avis d'un professionnel de sante.
    </p>
  </div>
</div>

<script>
const API = "";
async function analyser() {
  const btn = document.getElementById("btn");
  const zone = document.getElementById("resultat");
  btn.disabled = true;
  btn.textContent = "Analyse en cours...";
  zone.innerHTML = "";

  const patient = {
    age: parseInt(document.getElementById("age").value),
    glycemie: parseFloat(document.getElementById("glycemie").value),
    hemoglobine: parseFloat(document.getElementById("hemoglobine").value),
    fievre: parseFloat(document.getElementById("fievre").value),
    saison: parseInt(document.getElementById("saison").value)
  };

  try {
    const reponse = await fetch(API + "/predict", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(patient)
    });

    if (!reponse.ok) {
      afficherErreur("Donnees invalides (code " + reponse.status + ").");
      return;
    }

    const data = await reponse.json();
    afficherResultat(data);
  } catch (e) {
    afficherErreur("API injoignable. Le serveur est-il lance ?");
  } finally {
    btn.disabled = false;
    btn.textContent = "Analyser";
  }
}

function afficherResultat(data) {
  const p = data.probabilite_paludisme;
  let couleur = "bg-green-100 border-green-500 text-green-800";
  if (p >= 0.5) couleur = "bg-red-100 border-red-500 text-red-800";
  else if (p >= 0.3) couleur = "bg-orange-100 border-orange-500 text-orange-800";

  document.getElementById("resultat").innerHTML = `
    <div class="border-l-4 rounded-lg p-4 ${couleur}">
      <p class="text-sm">Probabilite de paludisme</p>
      <p class="text-4xl font-bold">${(p * 100).toFixed(1)}%</p>
      <p class="mt-2 font-semibold">${data.pre_diagnostic}</p>
    </div>`;
}

function afficherErreur(message) {
  document.getElementById("resultat").innerHTML = `
    <div class="border-l-4 border-slate-500 bg-slate-100 rounded-lg p-4 text-slate-700">
      <p>${message}</p>
    </div>`;
}
</script>

<footer class="mt-8 text-center text-xs text-slate-400">
  <p>SunuDiag - (c) 2026 Amadou Diallo</p>
  <p>Master 1 IABD - DMI/FST/UCAD</p>
</footer>

</body>
</html>
